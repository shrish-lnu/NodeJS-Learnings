name: CI

on:
  push:
    branches: [main]
    paths:
      - 'day5/**'
  pull_request:
    branches: [main]
    paths:
      - 'day5/**'

jobs:
  lint-and-build:
    name: Syntax check & install
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: day5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: day5/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (all source files)
        run: find src -name '*.js' -exec node --check {} \;
